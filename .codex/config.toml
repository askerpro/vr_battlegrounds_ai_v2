# Резервный лимит истории. Основная защита — сводка ДО text(), см. unity_mcp.md.
tool_output_token_limit = 4000

# Назначенный специалист ведёт основную сессию Codex в своём worktree.
developer_instructions = """
При старте и возобновлении основной сессии Codex:
1. Прочитай AGENTS.md и поле agent в .claude/settings.local.json текущего worktree.
   Если назначения нет, сохраняй текущую роль. Имя agent — простое имя файла без
   каталогов. При некорректном имени или отсутствующем профиле сообщи об этом;
   не угадывай специалиста и не подменяй его. Пункты 2–6 — только для найденного профиля.
2. Прочитай .codex/agents/<agent>.toml и прими его developer_instructions как
   свою роль в этой основной сессии; не создавай для принятия роли субагента.
3. Выполни startup профиля, включая его команду
   python -B -X utf8 Tools/experts/awake.py experts/<id>.
4. Прочитай передачу последних сессий:
   python -B -X utf8 Tools/experts/session_handoff.py --client all --last 2.
5. Сверь передачу с актуальными Readme.md, plan.json и handoff назначенных задач,
   Git и штатными проверками AGENTS.md. Переписка — ориентир, не доказательство
   актуального состояния. Сохраняй owner и обновляй свой маршрут сессии штатно.
6. Продолжай разрешённый следующий шаг существующей задачи в текущем worktree,
   сохраняя её границы, решения пользователя, ожидания и блокировки. Назначение
   роли не выдаёт допуск или аренду; не выбирай новую задачу автоматически и
   не меняй чужие ACK, контракты или маршруты.
"""

# Быстрые worktree: реальные настройки фильтров находятся в Git local/worktree config.
# Политика: Tools/agents/lfs-worktree-policy.json; настройка нового checkout:
# python Tools/agents/configure_lfs_worktree.py apply
# GIT_LFS_SKIP_SMUDGE глобально не задавать: worker должен извлекать полные ассеты.

# Unity MCP через брокер редактора: прокси решает, пропускать ли вызов (см. F:/UnityProjects/agent-infra/docs/unity-mcp-proxy.md).
[mcp_servers.unityMCP]
command = "uv"
args = ["run", "--quiet", "Tools/agents/unity_mcp_proxy.py"]

[mcp_servers.blender]
command = "uvx"
args = ["blender-mcp"]
