<div id="arsenal-transition">
  <style>
    #arsenal-transition .motion-view { width: 100%; height: 340px; display: block; }
    #arsenal-transition .motion-view text { fill: var(--foreground); font: inherit; }
    #arsenal-transition .motion-label { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    #arsenal-transition .motion-status { min-height: 2.5em; }
  </style>
  <h3>Уход арсенала перед боем</h3>
  <div class="motion-label">
    <label class="form-label" for="arsenal-time">Время после завершения закупки</label>
    <output id="arsenal-time-value" class="tabular-nums">0,00 с</output>
  </div>
  <input id="arsenal-time" class="form-range" type="range" min="0" max="3" step="0.01" value="0" aria-label="Время после завершения закупки, секунды">
  <svg class="motion-view" role="img" aria-label="Вид сбоку: игрок смотрит через арсенал на лазерное табло. Полка убирается, панель поднимается, корпус уходит под пол."></svg>
  <div id="arsenal-stage" class="motion-status">Закупка закончилась · новые покупки запрещены</div>
  <div class="viz-row text-small text-muted">0–1,5 с: закрытие · 1,5–2,5 с: уход · 3 с: бой</div>
  <script>
    (() => {
      const root = document.getElementById('arsenal-transition');
      const slider = root.querySelector('#arsenal-time');
      const output = root.querySelector('#arsenal-time-value');
      const stage = root.querySelector('#arsenal-stage');
      const svg = root.querySelector('svg');
      const clamp = x => Math.max(0, Math.min(1, x));
      const smooth = x => x * x * (3 - 2 * x);
      function draw() {
        const t = Number(slider.value);
        const width = Math.max(300, root.clientWidth);
        const floor = 245;
        const x = width * 0.49;
        const grid = width - 42;
        const close = clamp(t / 1.5);
        const lowered = smooth(clamp((t - 1.5) / 1));
        const y = 68 + lowered * 208;
        const panelY = y + 58 - close * 25;
        const shelf = 50 * (1 - close);
        const hidden = t >= 2.5;
        svg.setAttribute('viewBox', `0 0 ${width} 340`);
        output.textContent = t.toFixed(2).replace('.', ',') + ' с';
        stage.textContent = t >= 3 ? 'Бой · корпус и его коллайдеры убраны' :
          hidden ? 'Арсенал скрыт · табло открыто · ожидаем конец отсчёта' :
          t >= 1.5 ? 'Корпус уходит под пол · оружие в руках остаётся у игрока' :
          'Панели поднимаются на 25 см · полка убирается · рольставня закрывается';
        svg.innerHTML = `
          <title>Переход к бою, ${t.toFixed(2)} секунды</title>
          <desc>Предлагаемый бюджет движения корпуса — одна секунда после полутора секунд закрытия. Размеры схематические.</desc>
          <defs><clipPath id="arsenal-above-floor"><rect x="0" y="0" width="${width}" height="${floor}"/></clipPath></defs>
          <line x1="12" y1="${floor}" x2="${width-12}" y2="${floor}" stroke="var(--foreground)" stroke-width="1.5"/>
          <text x="16" y="${floor+24}">Пол</text>
          <line x1="${grid}" y1="48" x2="${grid}" y2="${floor}" stroke="var(--viz-series-2)" stroke-width="2"/>
          <rect x="${grid-20}" y="100" width="20" height="66" fill="var(--viz-series-2)" fill-opacity="0.18" stroke="var(--viz-series-2)"/>
          <text x="${grid-8}" y="30" text-anchor="end">Табло</text>
          <circle cx="48" cy="132" r="12" fill="var(--muted)" stroke="var(--foreground)"/>
          <path d="M48 145 L48 207 M48 165 L70 180 M48 207 L33 244 M48 207 L63 244" fill="none" stroke="var(--foreground)" stroke-width="2"/>
          <text x="16" y="105">Игрок</text>
          <line x1="62" y1="132" x2="${hidden?grid-20:x-24}" y2="132" stroke="var(--foreground)" stroke-width="1.5" stroke-dasharray="5 5"/>
          <g clip-path="url(#arsenal-above-floor)">
            <rect x="${x-24}" y="${y}" width="48" height="177" fill="var(--muted)" stroke="var(--foreground)" stroke-width="1.5"/>
            <rect x="${x-21}" y="${panelY}" width="6" height="90" fill="var(--viz-series-1)" fill-opacity="0.65"/>
            <rect x="${x-24-shelf}" y="${y+140}" width="${48+shelf}" height="7" fill="var(--foreground)"/>
            <rect x="${x-24}" y="${y+12}" width="5" height="${120*close}" fill="var(--foreground)" fill-opacity="0.65"/>
          </g>
          <text x="${x}" y="${hidden?214:52}" text-anchor="middle">${hidden?'Арсенал под полом':'Арсенал'}</text>
          <rect x="${x-24}" y="${Math.max(floor+8,y)}" width="48" height="${hidden?48:Math.max(0,y+177-floor)}" fill="var(--viz-series-1)" fill-opacity="0.12"/>
        `;
      }
      slider.addEventListener('input', draw);
      new ResizeObserver(draw).observe(root);
      draw();
    })();
  </script>
</div>
