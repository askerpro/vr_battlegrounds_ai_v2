# Plastic SCM здесь — только подсветка изменённых полей в инспекторе Unity.
# Источник истины — Git; post-commit переносит в Plastic лишь папки Assets,
# Packages и ProjectSettings. Новые (приватные) файлы Plastic ищет только в них,
# остальной корень не сканируется (tmp — гигабайты, .git, Docs, Tools...).
# Уже контролируемые Plastic файлы ignore.conf не затрагивает.
/*
!/Assets
!/Packages
!/ProjectSettings

# Внутри Unity-папок — то же, что игнорирует Git.
/Packages/com.coplaydev.unity-mcp
/Assets/Plugins/PlasticSCM*
/Assets/Plugins/Editor/JetBrains*
/Assets/Screenshots/screenshot-*
/Assets/StreamingAssets/aa*
/Assets/Addressables_Temp*
**/Assets/AssetStoreTools
/Assets/ThirdParty/TextMesh Pro/Examples & Extras
/Assets/ThirdParty/TextMesh Pro/Examples & Extras.meta
/Assets/ThirdParty/FImpossible Creations/Plugins - Animating/Legs Animator/Demos - Legs Animator
/Assets/ThirdParty/FImpossible Creations/Plugins - Animating/Legs Animator/Demos - Legs Animator.meta
/Assets/ThirdParty/FImpossible Creations/Plugins - Shared/FBasic Assets
/Assets/ThirdParty/FImpossible Creations/Plugins - Shared/FBasic Assets.meta
/Assets/ThirdParty/FImpossible Creations/Plugins - Shared/Utils
/Assets/ThirdParty/FImpossible Creations/Plugins - Shared/Utils.meta
InitTestScene*.unity*
*.private
*.private.meta
^*.private.[0-9]+$
^*.private.[0-9]+.meta$
*.log
*.tmp
*.blend1
*.blend1.meta
*.unitypackage
*.unitypackage.meta
*.pdb
*.pdb.meta
*.mdb
*.mdb.meta
*.pidb.meta
__pycache__
*.pyc
